<div id="draft-banner" class="hidden bg-red-600 text-white text-center text-sm font-semibold py-2 px-4">
  DRAFT — rebate data not yet verified.
</div>

<header class="max-w-6xl mx-auto px-4 pt-8 pb-4">
  <h1 class="text-2xl font-bold tracking-tight">Energize CT Heat Pump Rebate Estimator</h1>
  <p class="text-slate-600 text-sm mt-1">Daikin equipment · Swan Associates</p>
</header>

<main class="max-w-6xl mx-auto px-4 pb-12 grid gap-6 md:grid-cols-[minmax(0,22rem)_minmax(0,1fr)]">
  <!-- Left: inputs -->
  <form id="form" class="bg-white rounded-xl shadow-sm ring-1 ring-slate-200 p-5 space-y-4 self-start" onsubmit="return false">
    <label class="block">
      <span class="text-sm font-medium">Outdoor equipment type</span>
      <select id="equipment" class="mt-1 w-full rounded-md border-slate-300 border px-3 py-2">
        <option value="vrf">VRF</option>
        <option value="ashp">Residential air source HP</option>
        <option value="wshp">Water source HP</option>
        <option value="rtu_hp">Packaged HP rooftop</option>
        <option value="gshp">Ground source HP</option>
      </select>
    </label>

    <label class="block">
      <span class="text-sm font-medium">Indoor equipment type</span>
      <select id="indoor" class="mt-1 w-full rounded-md border-slate-300 border px-3 py-2">
        <option value="ducted">Ducted</option>
        <option value="ductless">Non-ducted</option>
        <option value="mixed">Mixed</option>
      </select>
    </label>

    <fieldset>
      <legend class="text-sm font-medium">Project type</legend>
      <div class="mt-1 flex gap-4">
        <label class="flex items-center gap-2"><input type="radio" name="project" value="new"> New construction</label>
        <label class="flex items-center gap-2"><input type="radio" name="project" value="replacement" checked> Replacement</label>
      </div>
    </fieldset>

    <label id="fuel-wrap" class="block">
      <span class="text-sm font-medium">Replacing</span>
      <select id="fuel" class="mt-1 w-full rounded-md border-slate-300 border px-3 py-2">
        <option value="oil">Oil</option>
        <option value="propane">Propane</option>
        <option value="gas">Natural gas</option>
        <option value="electric">Electric resistance</option>
        <option value="heat_pump">Existing heat pump</option>
      </select>
    </label>

    <label class="block">
      <span class="text-sm font-medium">Minimum efficiency (<span id="eff-label">IEER</span>)</span>
      <input id="minEff" type="number" step="0.1" min="0" inputmode="decimal" class="mt-1 w-full rounded-md border-slate-300 border px-3 py-2" placeholder="optional">
    </label>

    <label class="block">
      <span class="text-sm font-medium">System size (tons)</span>
      <input id="tons" type="number" step="0.5" min="0" inputmode="decimal" class="mt-1 w-full rounded-md border-slate-300 border px-3 py-2" placeholder="required for a dollar figure">
    </label>

    <label class="block">
      <span class="text-sm font-medium">Installed cost ($)</span>
      <input id="cost" type="number" step="1" min="0" inputmode="numeric" class="mt-1 w-full rounded-md border-slate-300 border px-3 py-2" placeholder="optional — used for the % cap">
    </label>

    <p class="text-xs text-slate-500">Track: <span id="track" class="font-semibold uppercase tracking-wide"></span></p>
  </form>

  <!-- Right: result card -->
  <section id="result" class="bg-white rounded-xl shadow-sm ring-1 ring-slate-200 p-5 min-w-0" aria-live="polite"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const money = (n) => "$" + Math.round(n).toLocaleString("en-US");
const num = (v) => (v === "" || v == null || isNaN(Number(v)) ? null : Number(v));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = new Date().toISOString().slice(0, 10);

function readInputs() {
  const equipment = $("equipment").value;
  const project = document.querySelector('input[name="project"]:checked').value;
  return {
    equipment,
    indoor: $("indoor").value,
    project,
    fuel: project === "new" ? "none" : $("fuel").value,
    track: equipment === "ashp" ? "residential" : "commercial",
    minEff: num($("minEff").value),
    tons: num($("tons").value),
    installedCost: num($("cost").value),
  };
}

// ── Logic (spec step 4) ──────────────────────────────────────────────────────
function matchRule(r, x) {
  return r.track === x.track
    && (r.equipment === "any" || r.equipment === x.equipment)
    && (r.project === "any" || r.project === x.project)
    && (r.fuel === "any" || r.fuel.includes(x.fuel))
    && today <= r.validTo;
}

function pickRule(x) {
  const matches = RULES.filter((r) => matchRule(r, x));
  return matches.sort((a, b) => b.ratePerTon - a.ratePerTon)[0] || null;
}

function estimate(rule, x) {
  if (x.tons == null) return null;
  const base = rule.ratePerTon * x.tons;
  let amount = base, capNote = null;
  if (rule.capDollars && amount > rule.capDollars) {
    amount = rule.capDollars;
    capNote = `Capped at ${money(rule.capDollars)} program maximum.`;
  }
  if (rule.capPctOfInstall && x.installedCost) {
    const pctCap = x.installedCost * rule.capPctOfInstall / 100;
    if (amount > pctCap) {
      amount = pctCap;
      capNote = `Capped at ${rule.capPctOfInstall}% of installed cost (${money(x.installedCost)} × ${rule.capPctOfInstall}% = ${money(pctCap)}).`;
    }
  }
  return { base, amount, capNote };
}

function needsPreapproval(rule, x, est) {
  return (rule.preapprovalTons != null && x.tons != null && x.tons > rule.preapprovalTons)
      || (rule.preapprovalDollars != null && est != null && est.amount > rule.preapprovalDollars);
}

const ratingFor = (m, x) => (x.track === "residential" ? m.seer2 : (m.ieer ?? m.eer2));

function matchModel(m, x) {
  const r = ratingFor(m, x);
  return (m.equipment === x.equipment || (x.equipment === "ashp" && m.equipment === "ashp_large" && x.tons >= 5.4))
    && (m.indoor === "any" || m.indoor === x.indoor || x.indoor === "mixed")
    && (x.tons == null || m.tons == null || Math.abs(m.tons - x.tons) <= 0.5 || x.equipment === "vrf")
    && (x.minEff == null || r == null || r >= x.minEff);
}

// ── Rendering ────────────────────────────────────────────────────────────────
const RATING_COLS = [["seer2", "SEER2"], ["hspf2", "HSPF2"], ["eer2", "EER2"], ["ieer", "IEER"], ["cop5f", "COP @5°F"]];

function effLabel(x) {
  if (x.track === "residential") return "SEER2";
  if (x.equipment === "rtu_hp") return "EER2 — packaged rooftop units are rated by EER2, not IEER";
  return "IEER";
}

function modelsTable(models) {
  if (!models.length) return `<p class="text-sm text-slate-600">No Daikin models in the list for this combination.</p>`;
  const sorted = [...models].sort((a, b) => (a.tons ?? Infinity) - (b.tons ?? Infinity) || a.model.localeCompare(b.model));
  const shown = sorted.slice(0, 50);
  const cols = RATING_COLS.filter(([k]) => models.some((m) => m[k] != null));
  const th = (t) => `<th class="text-left font-medium px-2 py-1.5 whitespace-nowrap">${t}</th>`;
  const td = (v) => `<td class="px-2 py-1.5 whitespace-nowrap">${v == null ? "—" : esc(v)}</td>`;
  return `
    ${sorted.length > 50 ? `<p class="text-xs text-slate-500 mb-2">Showing 50 of ${sorted.length.toLocaleString()}</p>` : `<p class="text-xs text-slate-500 mb-2">${sorted.length} model${sorted.length === 1 ? "" : "s"}</p>`}
    <div class="overflow-x-auto -mx-2">
      <table class="text-sm w-full">
        <thead class="bg-slate-100 text-slate-700"><tr>${th("Model")}${th("Tons")}${cols.map(([, l]) => th(l)).join("")}</tr></thead>
        <tbody class="divide-y divide-slate-100">
          ${shown.map((m) => `<tr>${td(m.model)}${td(m.tons)}${cols.map(([k]) => td(m[k])).join("")}</tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function verifiedLabel() {
  if (RULES.some((r) => !r.verifiedOn)) return "not yet verified";
  return RULES.map((r) => r.verifiedOn).sort().at(-1);
}

function footer() {
  return `<p class="text-xs text-slate-500 border-t border-slate-200 pt-4 mt-6">
    Estimate only. Rates and eligibility change; confirm against the current Energize CT rebate form before quoting.
    Data last verified ${esc(verifiedLabel())}.</p>`;
}

function render() {
  const x = readInputs();
  $("fuel-wrap").classList.toggle("hidden", x.project !== "replacement");
  $("track").textContent = x.track;
  $("eff-label").textContent = effLabel(x);

  const rule = pickRule(x);
  if (!rule) {
    $("result").innerHTML = `
      <p class="text-lg font-semibold">No Energize CT incentive found for this combination.</p>
      ${footer()}`;
    return;
  }

  const est = estimate(rule, x);
  const preapproval = needsPreapproval(rule, x, est);
  const models = MODELS.filter((m) => matchModel(m, x));

  const headline = est
    ? `<p class="text-4xl font-bold tracking-tight">${money(est.amount)}</p>
       <p class="text-sm text-slate-600 mt-1">${x.tons} tons × ${money(rule.ratePerTon)} = ${money(est.base)}</p>
       ${est.capNote ? `<p class="text-sm text-amber-700 mt-1">${esc(est.capNote)}</p>` : ""}`
    : `<p class="text-xl font-semibold text-slate-500">Enter system size for an estimate</p>`;

  $("result").innerHTML = `
    <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Estimated rebate</p>
    ${headline}

    <div class="mt-5">
      <p class="font-semibold">${esc(rule.label)}</p>
      <p class="text-sm text-slate-600">${esc(rule.program)} · valid through ${esc(rule.validTo)} ·
        <a class="text-blue-700 underline" href="${esc(rule.sourceUrl)}" target="_blank" rel="noopener">program page</a></p>
    </div>

    ${preapproval ? `<p class="mt-4 inline-block rounded-md bg-yellow-100 text-yellow-900 ring-1 ring-yellow-300 px-3 py-1 text-sm font-semibold">Pre-approval required</p>` : ""}

    <div class="mt-5">
      <p class="text-sm font-semibold mb-2">Conditions</p>
      <ul class="space-y-1.5 text-sm">
        ${rule.conditions.map((c) => `<li class="flex gap-2"><span aria-hidden="true" class="text-emerald-600">☐</span><span>${esc(c)}</span></li>`).join("")}
      </ul>
    </div>

    <div class="mt-6">
      <p class="text-sm font-semibold mb-2">Matching Daikin models</p>
      ${modelsTable(models)}
    </div>

    ${rule.footnotes && rule.footnotes.length ? `
      <div class="mt-6 text-xs text-slate-600 space-y-1">
        <p class="font-semibold">Notes</p>
        ${rule.footnotes.map((f, i) => `<p><sup>${i + 1}</sup> ${esc(f)}</p>`).join("")}
      </div>` : ""}

    ${footer()}`;
}

$("draft-banner").classList.toggle("hidden", !RULES.some((r) => !r.verifiedOn));
$("form").addEventListener("input", render);
$("form").addEventListener("change", render);
render();
</script>
